name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check src/media_witch tests --select E,W,F,I,B,C4,UP
        ruff format --check src/media_witch tests
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy src/media_witch
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest tests/unit/ -v --cov=media_witch --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

  cli-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI version
      run: media-witch --version

    - name: Test CLI help
      run: media-witch --help

    - name: Test organize subcommand
      run: media-witch organize --help

    - name: Test nfo subcommand
      run: media-witch nfo --help

    - name: Test subtitles subcommand
      run: media-witch subtitles --help

    - name: Test torrent subcommand
      run: media-witch torrent --help
